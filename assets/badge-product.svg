<svg width="150" height="34" viewBox="0 0 150 34" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="g" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      @keyframes breathe { 0%,100% { opacity: 0.45; } 50% { opacity: 0.95; } }
      .glow { animation: breathe 2.6s ease-in-out infinite; }
      .dot  { animation: breathe 2.6s ease-in-out infinite; }
      text  { font-family: Segoe UI, Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect class="glow" x="4" y="4" width="142" height="26" rx="13" fill="#34D399" filter="url(#g)"/>
  <rect x="1" y="1" width="148" height="32" rx="16" fill="#0b0b0e" stroke="#34D399" stroke-opacity="0.45"/>
  <circle class="dot" cx="20" cy="17" r="4" fill="#34D399"/>
  <text x="34" y="22" font-size="11" letter-spacing="2" font-weight="600" fill="#A7F3D4">PRODUCT</text>
</svg>
