<svg width="1200" height="24" viewBox="0 0 1200 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C6CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7C6CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes sweep {
        0%   { transform: translateX(-60px); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { transform: translateX(1260px); opacity: 0; }
      }
      .shine { animation: sweep 5s linear infinite; }
      @keyframes pulse {
        0%, 100% { r: 3; opacity: 1; }
        50%      { r: 4.2; opacity: 0.7; }
      }
      .dot { animation: pulse 2.4s ease-in-out infinite; }
    </style>
  </defs>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="url(#fade)" stroke-width="1"/>
  <ellipse class="shine" cx="0" cy="12" rx="60" ry="8" fill="url(#shine)"/>
  <circle class="dot" cx="600" cy="12" r="3" fill="#34D399"/>
</svg>
